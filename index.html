<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>卷毛可卡布</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e87062'/%3E%3Ccircle cx='5.8' cy='6.6' r='1.1' fill='%2320252b'/%3E%3Ccircle cx='10.2' cy='6.6' r='1.1' fill='%2320252b'/%3E%3Cpath d='M5.3 10c1.7 1.4 3.7 1.4 5.4 0' stroke='%2320252b' stroke-width='1.1' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path d="M20.5 8.6c0 5.2-8.5 10-8.5 10S3.5 13.8 3.5 8.6A4.4 4.4 0 0 1 12 6.8a4.4 4.4 0 0 1 8.5 1.8Z"></path>
      </symbol>
      <symbol id="icon-bowl" viewBox="0 0 24 24">
        <path d="M4 10h16l-1.6 6.2A4 4 0 0 1 14.5 19h-5a4 4 0 0 1-3.9-2.8L4 10Z"></path>
        <path d="M8 10V8a4 4 0 0 1 8 0v2"></path>
        <path d="M8 14h8"></path>
      </symbol>
      <symbol id="icon-steps" viewBox="0 0 24 24">
        <path d="M7 9.5c1.6-.5 2.3-2.5 1.6-4.4C8 3.2 6.6 2.1 5.2 2.5 3.8 2.9 3.2 4.7 3.8 6.6 4.4 8.5 5.6 10 7 9.5Z"></path>
        <path d="M17 14.5c1.6-.5 2.3-2.5 1.6-4.4-.6-1.9-2-3-3.4-2.6-1.4.4-2 2.2-1.4 4.1.6 1.9 1.8 3.4 3.2 2.9Z"></path>
        <path d="M9 22c2.2-.5 3.4-2.7 2.8-4.9-.6-2.2-2.6-3.5-4.6-3-2 .5-3 2.6-2.4 4.8.6 2.2 2.1 3.6 4.2 3.1Z"></path>
      </symbol>
      <symbol id="icon-bed" viewBox="0 0 24 24">
        <path d="M4 5v14"></path>
        <path d="M4 13h16a2 2 0 0 1 2 2v4"></path>
        <path d="M4 9h6a2 2 0 0 1 2 2v2"></path>
        <path d="M2 19h20"></path>
      </symbol>
      <symbol id="icon-home" viewBox="0 0 24 24">
        <path d="m3 11 9-8 9 8"></path>
        <path d="M5 10v10h14V10"></path>
        <path d="M10 20v-6h4v6"></path>
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"></path>
      </symbol>
    </svg>

    <main class="app" aria-label="卷毛可卡布互动宠物">
      <section class="status-bar" aria-label="卷毛状态">
        <div>
          <p class="eyebrow">卷毛</p>
          <h1>可卡布陪伴中</h1>
        </div>
        <p class="mood" id="mood">尾巴轻轻晃着。</p>
      </section>

      <section class="stage" aria-label="互动区域">
        <div class="window-view" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <section class="pet" id="pet" tabindex="0" aria-label="卷毛，可互动的可卡布小狗">
          <div class="speech" id="speech" aria-live="polite">卷毛在。</div>
          <div class="sprite" id="sprite" aria-hidden="true"></div>
          <div class="float-layer" id="float-layer" aria-hidden="true"></div>
        </section>
      </section>

      <aside class="care-panel" aria-label="照顾卷毛">
        <div class="meters">
          <label>
            <span>亲密</span>
            <meter id="love-meter" min="0" max="100" value="62"></meter>
          </label>
          <label>
            <span>饱腹</span>
            <meter id="fullness-meter" min="0" max="100" value="72"></meter>
          </label>
          <label>
            <span>精力</span>
            <meter id="energy-meter" min="0" max="100" value="76"></meter>
          </label>
        </div>

        <div class="actions" aria-label="互动动作">
          <button type="button" data-action="pat" title="摸摸" aria-label="摸摸卷毛">
            <svg viewBox="0 0 24 24"><use href="#icon-heart"></use></svg>
            <span>摸摸</span>
          </button>
          <button type="button" data-action="feed" title="投喂" aria-label="投喂卷毛">
            <svg viewBox="0 0 24 24"><use href="#icon-bowl"></use></svg>
            <span>投喂</span>
          </button>
          <button type="button" data-action="walk" title="遛弯" aria-label="带卷毛遛弯">
            <svg viewBox="0 0 24 24"><use href="#icon-steps"></use></svg>
            <span>遛弯</span>
          </button>
          <button type="button" data-action="nap" title="休息" aria-label="让卷毛休息">
            <svg viewBox="0 0 24 24"><use href="#icon-bed"></use></svg>
            <span>休息</span>
          </button>
          <button type="button" data-action="call" title="召回" aria-label="召回卷毛">
            <svg viewBox="0 0 24 24"><use href="#icon-home"></use></svg>
            <span>召回</span>
          </button>
          <button type="button" data-action="review" title="陪读" aria-label="让卷毛陪读">
            <svg viewBox="0 0 24 24"><use href="#icon-eye"></use></svg>
            <span>陪读</span>
          </button>
        </div>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
